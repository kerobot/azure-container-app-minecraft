name: Update Minecraft Version

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '更新対象の環境'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      minecraftVersion:
        description: '更新後のMinecraftバージョン (例: 26.2)'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  update:
    name: Update Minecraft version (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve resource group / param file
        id: vars
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "resource_group=${{ vars.AZURE_RESOURCE_GROUP_PROD }}" >> "$GITHUB_OUTPUT"
            echo "param_file=infra/environments/prod.bicepparam" >> "$GITHUB_OUTPUT"
            echo "app_name=${{ vars.PROD_CONTAINER_APP_NAME }}" >> "$GITHUB_OUTPUT"
          else
            echo "resource_group=${{ vars.AZURE_RESOURCE_GROUP_DEV }}" >> "$GITHUB_OUTPUT"
            echo "param_file=infra/environments/dev.bicepparam" >> "$GITHUB_OUTPUT"
            echo "app_name=${{ vars.DEV_CONTAINER_APP_NAME }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate required settings
        env:
          RESOURCE_GROUP: ${{ steps.vars.outputs.resource_group }}
          APP_NAME: ${{ steps.vars.outputs.app_name }}
          MINECRAFT_VERSION: ${{ inputs.minecraftVersion }}
          RCON_PASSWORD: ${{ inputs.environment == 'prod' && secrets.PROD_MINECRAFT_RCON_PASSWORD || secrets.DEV_MINECRAFT_RCON_PASSWORD }}
          WHITELIST_USERS: ${{ inputs.environment == 'prod' && vars.PROD_MINECRAFT_WHITELIST_USERS || vars.DEV_MINECRAFT_WHITELIST_USERS }}
        run: |
          set -euo pipefail
          missing=0
          check_required() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "Missing required setting: ${name}" >&2
              missing=1
            fi
          }
          check_required "resource_group" "$RESOURCE_GROUP"
          check_required "app_name" "$APP_NAME"
          check_required "minecraftVersion" "$MINECRAFT_VERSION"
          check_required "RCON password" "$RCON_PASSWORD"
          check_required "whitelist users" "$WHITELIST_USERS"
          exit "$missing"

      # 停止しておかないと、新旧リビジョンがワールドの session.lock を奪い合う。
      - name: Stop server before version update
        shell: pwsh
        timeout-minutes: 20
        env:
          RESOURCE_GROUP: ${{ steps.vars.outputs.resource_group }}
          APP_NAME: ${{ steps.vars.outputs.app_name }}
        run: |
          $status = ./scripts/status-server.ps1 -ResourceGroupName $env:RESOURCE_GROUP -AppName $env:APP_NAME | Out-String
          Write-Host $status
          if ($status -match 'RunningRepl\s*:\s*[1-9]') {
            ./scripts/stop-server.ps1 -ResourceGroupName $env:RESOURCE_GROUP -AppName $env:APP_NAME -Force
          }

      - name: Deploy Bicep with updated Minecraft version
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ steps.vars.outputs.resource_group }}
          template: infra/main.bicep
          # opUsersはmain.bicepで既定値''を持つ任意パラメーターのため、必須チェックの対象にしていない。
          parameters: >-
            ${{ steps.vars.outputs.param_file }}
            minecraftVersion=${{ inputs.minecraftVersion }}
            rconPassword=${{ inputs.environment == 'prod' && secrets.PROD_MINECRAFT_RCON_PASSWORD || secrets.DEV_MINECRAFT_RCON_PASSWORD }}
            whitelistUsers=${{ inputs.environment == 'prod' && vars.PROD_MINECRAFT_WHITELIST_USERS || vars.DEV_MINECRAFT_WHITELIST_USERS }}
            opUsers=${{ inputs.environment == 'prod' && vars.PROD_MINECRAFT_OP_USERS || vars.DEV_MINECRAFT_OP_USERS }}
          deploymentMode: Incremental
          failOnStdErr: false

      # minReplicas=0 のため、次回のTCP接続時に新しいリビジョンが新バージョンで起動します。
      - name: Verify new version
        shell: pwsh
        timeout-minutes: 15
        env:
          RESOURCE_GROUP: ${{ steps.vars.outputs.resource_group }}
          APP_NAME: ${{ steps.vars.outputs.app_name }}
        run: |
          ./scripts/start-server.ps1 -ResourceGroupName $env:RESOURCE_GROUP -AppName $env:APP_NAME
