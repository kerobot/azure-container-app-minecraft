name: Validate Infra

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/validate-infra.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP_DEV: ${{ vars.AZURE_RESOURCE_GROUP_DEV }}

jobs:
  build-and-lint:
    name: Bicep build & lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bicep build (main.bicep)
        run: az bicep build --file infra/main.bicep --outfile /tmp/main.json

      - name: Bicep lint (main.bicep)
        run: az bicep lint --file infra/main.bicep

      - name: Bicep build-params (dev)
        run: az bicep build-params --file infra/environments/dev.bicepparam --outfile /tmp/dev.json
        env:
          MINECRAFT_WHITELIST_USERS: placeholder-user
          MINECRAFT_RCON_PASSWORD: placeholder-password

      - name: Bicep build-params (prod)
        run: az bicep build-params --file infra/environments/prod.bicepparam --outfile /tmp/prod.json
        env:
          MINECRAFT_WHITELIST_USERS: placeholder-user
          MINECRAFT_RCON_PASSWORD: placeholder-password

  what-if:
    name: What-If (dev)
    runs-on: ubuntu-latest
    needs: build-and-lint
    if: ${{ vars.AZURE_RESOURCE_GROUP_DEV != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-If deployment (dev parameters)
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP_DEV }}
          template: infra/main.bicep
          parameters: infra/environments/dev.bicepparam rconPassword=${{ secrets.DEV_MINECRAFT_RCON_PASSWORD }} whitelistUsers=${{ vars.DEV_MINECRAFT_WHITELIST_USERS }}
          deploymentMode: Incremental
          additionalArguments: --what-if
