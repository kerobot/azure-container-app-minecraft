name: Deploy (prod)

on:
  workflow_dispatch:
    inputs:
      minecraftVersion:
        description: '固定するMinecraftバージョン (例: 1.20.4)。空欄の場合はprod.bicepparamの既定値を使用'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    # 本番デプロイはGitHub Environmentの保護ルール(必須レビュー承認)により承認が必要。
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate required settings
        env:
          AZURE_RESOURCE_GROUP_PROD_VALUE: ${{ vars.AZURE_RESOURCE_GROUP_PROD }}
          AZURE_LOCATION_VALUE: ${{ vars.AZURE_LOCATION }}
          PROD_MINECRAFT_RCON_PASSWORD_VALUE: ${{ secrets.PROD_MINECRAFT_RCON_PASSWORD }}
          PROD_MINECRAFT_WHITELIST_USERS_VALUE: ${{ vars.PROD_MINECRAFT_WHITELIST_USERS }}
          PROD_CONTAINER_APP_NAME_VALUE: ${{ vars.PROD_CONTAINER_APP_NAME }}
        run: |
          set -euo pipefail
          missing=0
          check_required() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "Missing required setting: ${name}" >&2
              missing=1
            fi
          }
          check_required "AZURE_RESOURCE_GROUP_PROD" "$AZURE_RESOURCE_GROUP_PROD_VALUE"
          check_required "AZURE_LOCATION" "$AZURE_LOCATION_VALUE"
          check_required "PROD_MINECRAFT_RCON_PASSWORD" "$PROD_MINECRAFT_RCON_PASSWORD_VALUE"
          check_required "PROD_MINECRAFT_WHITELIST_USERS" "$PROD_MINECRAFT_WHITELIST_USERS_VALUE"
          check_required "PROD_CONTAINER_APP_NAME" "$PROD_CONTAINER_APP_NAME_VALUE"
          exit "$missing"

      - name: Ensure resource group exists
        run: |
          az group show --name "${{ vars.AZURE_RESOURCE_GROUP_PROD }}" \
            || az group create --name "${{ vars.AZURE_RESOURCE_GROUP_PROD }}" --location "${{ vars.AZURE_LOCATION }}"

      - name: Deploy Bicep (prod parameters)
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP_PROD }}
          template: infra/main.bicep
          parameters: >-
            infra/environments/prod.bicepparam
            rconPassword=${{ secrets.PROD_MINECRAFT_RCON_PASSWORD }}
            whitelistUsers=${{ vars.PROD_MINECRAFT_WHITELIST_USERS }}
            opUsers=${{ vars.PROD_MINECRAFT_OP_USERS }}
            ${{ github.event.inputs.minecraftVersion != '' && format('minecraftVersion={0}', github.event.inputs.minecraftVersion) || '' }}
          deploymentMode: Incremental
          failOnStdErr: false
