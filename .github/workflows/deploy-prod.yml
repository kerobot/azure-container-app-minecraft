name: Deploy (prod)

on:
  workflow_dispatch:
    inputs:
      minecraftVersion:
        description: '固定するMinecraftバージョン (例: 26.2)。空欄の場合はprod.bicepparamの既定値を使用'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    # 本番デプロイはGitHub Environmentの保護ルール(必須レビュー承認)により承認が必要。
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate required settings
        env:
          AZURE_RESOURCE_GROUP_PROD_VALUE: ${{ vars.AZURE_RESOURCE_GROUP_PROD }}
          AZURE_LOCATION_VALUE: ${{ vars.AZURE_LOCATION }}
          PROD_MINECRAFT_RCON_PASSWORD_VALUE: ${{ secrets.PROD_MINECRAFT_RCON_PASSWORD }}
          PROD_MINECRAFT_WHITELIST_USERS_VALUE: ${{ vars.PROD_MINECRAFT_WHITELIST_USERS }}
          PROD_CONTAINER_APP_NAME_VALUE: ${{ vars.PROD_CONTAINER_APP_NAME }}
        run: |
          set -euo pipefail
          missing=0
          check_required() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "Missing required setting: ${name}" >&2
              missing=1
            fi
          }
          check_required "AZURE_RESOURCE_GROUP_PROD" "$AZURE_RESOURCE_GROUP_PROD_VALUE"
          check_required "AZURE_LOCATION" "$AZURE_LOCATION_VALUE"
          check_required "PROD_MINECRAFT_RCON_PASSWORD" "$PROD_MINECRAFT_RCON_PASSWORD_VALUE"
          check_required "PROD_MINECRAFT_WHITELIST_USERS" "$PROD_MINECRAFT_WHITELIST_USERS_VALUE"
          # PROD_CONTAINER_APP_NAMEはこのデプロイでは未使用だが、start/stop/update workflowで
          # 必要になるため、環境設定の不備をデプロイ時点で早期検知する目的で検証する。
          check_required "PROD_CONTAINER_APP_NAME" "$PROD_CONTAINER_APP_NAME_VALUE"
          exit "$missing"

      - name: Ensure resource group exists
        run: |
          az group show --name "${{ vars.AZURE_RESOURCE_GROUP_PROD }}" \
            || az group create --name "${{ vars.AZURE_RESOURCE_GROUP_PROD }}" --location "${{ vars.AZURE_LOCATION }}"

      # 新旧リビジョンが同時に起動するとワールドの session.lock が競合するため、
      # デプロイ前にサーバーを停止しておく。
      - name: Stop server before deploy
        shell: pwsh
        timeout-minutes: 25
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_PROD }}
          APP_NAME: ${{ vars.PROD_CONTAINER_APP_NAME }}
        run: |
          az containerapp show --name $env:APP_NAME --resource-group $env:RESOURCE_GROUP -o none 2>$null
          $appExists = ($LASTEXITCODE -eq 0)
          if ($appExists) {
            ./scripts/stop-server.ps1 -ResourceGroupName $env:RESOURCE_GROUP -AppName $env:APP_NAME -Force
          }
          else {
            Write-Host '初回デプロイのため停止処理は不要です。'
            $global:LASTEXITCODE = 0
          }
            
      - name: Deploy Bicep (prod parameters)
        uses: azure/arm-deploy@v2
        env:
          # arm-deployはまだNode20ランタイムのみ対応のため、Node20非推奨警告を一時的に抑制する。
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP_PROD }}
          template: infra/main.bicep
          # opUsers (PROD_MINECRAFT_OP_USERS) はmain.bicepで既定値''を持つ任意パラメーターのため、
          # whitelistUsersと異なり必須チェックの対象にしていない。
          parameters: >-
            infra/environments/prod.bicepparam
            rconPassword=${{ secrets.PROD_MINECRAFT_RCON_PASSWORD }}
            whitelistUsers=${{ vars.PROD_MINECRAFT_WHITELIST_USERS }}
            opUsers=${{ vars.PROD_MINECRAFT_OP_USERS }}
            ${{ github.event.inputs.minecraftVersion != '' && format('minecraftVersion={0}', github.event.inputs.minecraftVersion) || '' }}
          deploymentMode: Incremental
          failOnStdErr: false
