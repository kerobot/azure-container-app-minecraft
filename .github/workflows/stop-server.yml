name: Stop Minecraft Server

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '停止対象の環境'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  stop:
    name: Stop server (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve resource group / app name
        id: vars
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "resource_group=${{ vars.AZURE_RESOURCE_GROUP_PROD }}" >> "$GITHUB_OUTPUT"
            echo "app_name=${{ vars.PROD_CONTAINER_APP_NAME }}" >> "$GITHUB_OUTPUT"
          else
            echo "resource_group=${{ vars.AZURE_RESOURCE_GROUP_DEV }}" >> "$GITHUB_OUTPUT"
            echo "app_name=${{ vars.DEV_CONTAINER_APP_NAME }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate required settings
        env:
          RESOURCE_GROUP: ${{ steps.vars.outputs.resource_group }}
          APP_NAME: ${{ steps.vars.outputs.app_name }}
        run: |
          set -euo pipefail
          missing=0
          check_required() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "Missing required setting: ${name}" >&2
              missing=1
            fi
          }
          check_required "resource_group" "$RESOURCE_GROUP"
          check_required "app_name" "$APP_NAME"
          exit "$missing"

      - name: Stop server
        shell: pwsh
        timeout-minutes: 10
        env:
          RESOURCE_GROUP: ${{ steps.vars.outputs.resource_group }}
          APP_NAME: ${{ steps.vars.outputs.app_name }}
        run: |
          ./scripts/stop-server.ps1 -ResourceGroupName $env:RESOURCE_GROUP -AppName $env:APP_NAME -Force
