name: Stop Minecraft Server

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '停止対象の環境'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  stop:
    name: Stop server (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve resource group / app name
        id: vars
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "resource_group=${{ vars.AZURE_RESOURCE_GROUP_PROD }}" >> "$GITHUB_OUTPUT"
            echo "app_name=mcaca-prod-minecraft" >> "$GITHUB_OUTPUT"
          else
            echo "resource_group=${{ vars.AZURE_RESOURCE_GROUP_DEV }}" >> "$GITHUB_OUTPUT"
            echo "app_name=mcaca-dev-minecraft" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether a replica is running
        id: check
        run: |
          RUNNING=$(az containerapp replica list \
            --name "${{ steps.vars.outputs.app_name }}" \
            --resource-group "${{ steps.vars.outputs.resource_group }}" \
            --query "length([?properties.runningState=='Running'])" -o tsv || echo 0)
          echo "running=${RUNNING:-0}" >> "$GITHUB_OUTPUT"

      - name: Save world (save-all flush) before stopping
        if: steps.check.outputs.running != '0'
        run: |
          set -euo pipefail
          REPLICA=$(az containerapp replica list \
            --name "${{ steps.vars.outputs.app_name }}" \
            --resource-group "${{ steps.vars.outputs.resource_group }}" \
            --query "[0].name" -o tsv)
          echo "ワールドデータをフラッシュ保存します (replica: ${REPLICA})"
          # itzg/minecraft-server イメージに同梱の rcon-cli を使い、コンテナー内部からのみ
          # RCON経由でセーブコマンドを発行する。RCONは外部には公開していない。
          az containerapp exec \
            --name "${{ steps.vars.outputs.app_name }}" \
            --resource-group "${{ steps.vars.outputs.resource_group }}" \
            --replica "${REPLICA}" \
            --command "rcon-cli save-all flush" || echo "警告: rcon-cliによる保存に失敗しました。コンテナー停止時の自動セーブに委ねます。"
          # 保存が完了するまで少し待機する。
          sleep 15

      - name: Set minReplicas to 0
        run: |
          az containerapp update \
            --name "${{ steps.vars.outputs.app_name }}" \
            --resource-group "${{ steps.vars.outputs.resource_group }}" \
            --min-replicas 0 \
            --max-replicas 1
