name: Deploy (dev)

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate required settings
        env:
          AZURE_RESOURCE_GROUP_DEV_VALUE: ${{ vars.AZURE_RESOURCE_GROUP_DEV }}
          AZURE_LOCATION_VALUE: ${{ vars.AZURE_LOCATION }}
          DEV_MINECRAFT_RCON_PASSWORD_VALUE: ${{ secrets.DEV_MINECRAFT_RCON_PASSWORD }}
          DEV_MINECRAFT_WHITELIST_USERS_VALUE: ${{ vars.DEV_MINECRAFT_WHITELIST_USERS }}
          DEV_CONTAINER_APP_NAME_VALUE: ${{ vars.DEV_CONTAINER_APP_NAME }}
        run: |
          set -euo pipefail
          missing=0
          check_required() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "Missing required setting: ${name}" >&2
              missing=1
            fi
          }
          check_required "AZURE_RESOURCE_GROUP_DEV" "$AZURE_RESOURCE_GROUP_DEV_VALUE"
          check_required "AZURE_LOCATION" "$AZURE_LOCATION_VALUE"
          check_required "DEV_MINECRAFT_RCON_PASSWORD" "$DEV_MINECRAFT_RCON_PASSWORD_VALUE"
          check_required "DEV_MINECRAFT_WHITELIST_USERS" "$DEV_MINECRAFT_WHITELIST_USERS_VALUE"
          check_required "DEV_CONTAINER_APP_NAME" "$DEV_CONTAINER_APP_NAME_VALUE"
          exit "$missing"

      - name: Ensure resource group exists
        run: |
          az group show --name "${{ vars.AZURE_RESOURCE_GROUP_DEV }}" \
            || az group create --name "${{ vars.AZURE_RESOURCE_GROUP_DEV }}" --location "${{ vars.AZURE_LOCATION }}"

      - name: Deploy Bicep (dev parameters)
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP_DEV }}
          template: infra/main.bicep
          parameters: >-
            infra/environments/dev.bicepparam
            rconPassword=${{ secrets.DEV_MINECRAFT_RCON_PASSWORD }}
            whitelistUsers=${{ vars.DEV_MINECRAFT_WHITELIST_USERS }}
            opUsers=${{ vars.DEV_MINECRAFT_OP_USERS }}
          deploymentMode: Incremental
          failOnStdErr: false
