name: Deploy (dev)

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate required settings
        env:
          AZURE_RESOURCE_GROUP_DEV_VALUE: ${{ vars.AZURE_RESOURCE_GROUP_DEV }}
          AZURE_LOCATION_VALUE: ${{ vars.AZURE_LOCATION }}
          DEV_MINECRAFT_RCON_PASSWORD_VALUE: ${{ secrets.DEV_MINECRAFT_RCON_PASSWORD }}
          DEV_MINECRAFT_WHITELIST_USERS_VALUE: ${{ vars.DEV_MINECRAFT_WHITELIST_USERS }}
          DEV_CONTAINER_APP_NAME_VALUE: ${{ vars.DEV_CONTAINER_APP_NAME }}
        run: |
          set -euo pipefail
          missing=0
          check_required() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "Missing required setting: ${name}" >&2
              missing=1
            fi
          }
          check_required "AZURE_RESOURCE_GROUP_DEV" "$AZURE_RESOURCE_GROUP_DEV_VALUE"
          check_required "AZURE_LOCATION" "$AZURE_LOCATION_VALUE"
          check_required "DEV_MINECRAFT_RCON_PASSWORD" "$DEV_MINECRAFT_RCON_PASSWORD_VALUE"
          check_required "DEV_MINECRAFT_WHITELIST_USERS" "$DEV_MINECRAFT_WHITELIST_USERS_VALUE"
          # DEV_CONTAINER_APP_NAMEはこのデプロイでは未使用だが、start/stop/update workflowで
          # 必要になるため、環境設定の不備をデプロイ時点で早期検知する目的で検証する。
          check_required "DEV_CONTAINER_APP_NAME" "$DEV_CONTAINER_APP_NAME_VALUE"
          exit "$missing"

      - name: Ensure resource group exists
        run: |
          az group show --name "${{ vars.AZURE_RESOURCE_GROUP_DEV }}" \
            || az group create --name "${{ vars.AZURE_RESOURCE_GROUP_DEV }}" --location "${{ vars.AZURE_LOCATION }}"

      # 新旧リビジョンが同時に起動するとワールドの session.lock が競合するため、
      # デプロイ前にサーバーを停止しておく。
      - name: Stop server before deploy
        shell: pwsh
        timeout-minutes: 20
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_DEV }}
          APP_NAME: ${{ vars.DEV_CONTAINER_APP_NAME }}
        run: |
          az containerapp show --name $env:APP_NAME --resource-group $env:RESOURCE_GROUP -o none 2>$null
          if ($LASTEXITCODE -eq 0) {
            ./scripts/stop-server.ps1 -ResourceGroupName $env:RESOURCE_GROUP -AppName $env:APP_NAME
          }
          else {
            Write-Host '初回デプロイのため停止処理は不要です。'
          }

      - name: Deploy Bicep (dev parameters)
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP_DEV }}
          template: infra/main.bicep
          # opUsers (DEV_MINECRAFT_OP_USERS) はmain.bicepで既定値''を持つ任意パラメーターのため、
          # whitelistUsersと異なり必須チェックの対象にしていない。
          parameters: >-
            infra/environments/dev.bicepparam
            rconPassword=${{ secrets.DEV_MINECRAFT_RCON_PASSWORD }}
            whitelistUsers=${{ vars.DEV_MINECRAFT_WHITELIST_USERS }}
            opUsers=${{ vars.DEV_MINECRAFT_OP_USERS }}
          deploymentMode: Incremental
          failOnStdErr: false
